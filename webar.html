<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Casa Capsula X7 — WebAR 360°</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
<style>
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,Helvetica,sans-serif;color:#fff}
#pano{position:absolute;inset:0}.ui{position:absolute;z-index:20}
.top{top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge,.btn{background:rgba(12,12,14,.72);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(12px);box-shadow:0 6px 24px #0006;border-radius:12px;color:#fff}
.badge{padding:10px 13px;font-weight:800;font-size:13px}.offer{background:#fff;color:#111;text-decoration:none;padding:10px 12px;border-radius:11px;font-weight:800;font-size:12px}
.panel{left:14px;top:78px;display:flex;flex-direction:column;gap:7px}.btn{padding:9px 10px;font-size:11px;cursor:pointer}.btn span{font-size:17px;display:block;margin-bottom:1px}
.bottom{left:0;right:0;bottom:0;padding:28px 14px 13px;background:linear-gradient(0deg,rgba(0,0,0,.93),rgba(0,0,0,0))}
.title{font-size:14px;font-weight:800;margin-bottom:8px;text-shadow:0 2px 8px #000}
.rail{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
.card{min-width:98px;height:56px;border:1px solid #fff3;border-radius:8px;overflow:hidden;background:#222;position:relative;padding:0;cursor:pointer}
.card img{width:100%;height:100%;object-fit:cover}.card b{position:absolute;left:5px;right:5px;bottom:4px;font-size:10px;text-shadow:0 1px 6px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.active{outline:2px solid #fff;outline-offset:1px}
.start{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,rgba(30,30,35,.8),rgba(0,0,0,.96))}
.startbox{width:min(92vw,440px);text-align:center;padding:28px 22px;border:1px solid #fff2;border-radius:18px;background:rgba(18,18,20,.82);backdrop-filter:blur(14px);box-shadow:0 15px 60px #000a}
.startbox h1{margin:0 0 8px;font-size:25px}.startbox p{margin:8px 0;color:#ddd;line-height:1.45;font-size:14px}
.go{margin-top:16px;border:0;border-radius:13px;padding:13px 18px;font-size:14px;font-weight:800;background:#fff;color:#111;cursor:pointer}
.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:25;padding:11px 14px;border-radius:10px;background:#0009;border:1px solid #fff2;text-align:center;font-size:12px;opacity:0;transition:.4s}.hint.show{opacity:1}
.pnlm-hotspot.floor-point{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);border:3px solid #fff;box-shadow:0 4px 20px #0009;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center}
.pnlm-hotspot.floor-point:after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid #fff9;animation:pulse 1.8s infinite}.floor-point .dot{width:12px;height:12px;border-radius:50%;background:#fff}
@keyframes pulse{0%,100%{transform:scale(.85);opacity:.7}70%{transform:scale(1.15);opacity:0}}
@media(max-width:700px){.panel{left:auto;right:10px;top:70px;flex-direction:row}.panel .txt{display:none}.btn{padding:8px 9px}.badge{font-size:11px;padding:9px 10px}.offer{font-size:11px;padding:9px 10px}.card{min-width:86px;height:50px}}
</style>
</head>
<body>
<div id="app">
<div id="pano"></div>
<div class="ui top"><div class="badge">CASA CAPSULA X7 · WEBAR 360°</div><a class="offer" href="https://wa.me/?text=Salut!%20Vreau%20o%20oferta%20pentru%20Casa%20Capsula%20X7." target="_blank" rel="noopener">SOLICITĂ OFERTĂ</a></div>
<div class="ui panel">
<button class="btn" id="motion"><span>◉</span><em class="txt">MIȘCARE</em></button>
<button class="btn" id="zin"><span>＋</span><em class="txt">ZOOM</em></button>
<button class="btn" id="zout"><span>−</span><em class="txt">ZOOM</em></button>
<button class="btn" id="full"><span>⛶</span><em class="txt">ECRAN</em></button>
</div>
<div class="ui hint" id="hint">Mișcă telefonul pentru a privi în jur.<br>Poți și trage cu degetul.</div>
<div class="ui bottom"><div class="title" id="title">INTRARE</div><div class="rail" id="rail"></div></div>
<div class="start" id="start"><div class="startbox"><h1>Casa Capsula X7</h1><p><b>WEBAR 360°</b></p><p>Apasă butonul de mai jos și rotește telefonul pentru a explora casa. Cercurile de pe podea te duc în următorul punct.</p><button class="go" id="go">PORNEȘTE TURUL WEBAR</button></div></div>
</div>
<script>
const scenes=[
{id:"s1",name:"INTRARE",img:"IMG_20261005_155406_00_187.jpg"},
{id:"s2",name:"HOL · LIVING",img:"IMG_20261005_155514_00_188.jpg"},
{id:"s3",name:"HOL · BAIE",img:"IMG_20261005_155554_00_189.jpg"},
{id:"s4",name:"BAIE · DUȘ",img:"IMG_20261005_155757_00_191.jpg"},
{id:"s5",name:"BAIE · LAVABO",img:"IMG_20261005_155834_00_192.jpg"},
{id:"s6",name:"HOL · 2",img:"IMG_20261005_155646_00_190.jpg"},
{id:"s7",name:"BUCĂTĂRIE",img:"IMG_20261005_155133_00_183.jpg"},
{id:"s8",name:"LIVING",img:"IMG_20261005_155143_00_184.jpg"},
{id:"s9",name:"LIVING · PANORAMĂ",img:"IMG_20261005_155322_00_186.jpg"}
];
const cfg={default:{firstScene:"s1",sceneFadeDuration:500,autoLoad:true,showControls:true,compass:false,mouseZoom:true},scenes:{}};
function point(div,args){div.innerHTML='<span class="dot"></span>';div.title=args.label;div.setAttribute('aria-label',args.label)}
scenes.forEach((s,i)=>{
 cfg.scenes[s.id]={title:s.name,type:"equirectangular",panorama:s.img,hfov:98,minHfov:58,maxHfov:120,hotSpots:[]};
 if(i>0) cfg.scenes[s.id].hotSpots.push({pitch:-24,yaw:180,type:"scene",sceneId:scenes[i-1].id,cssClass:"floor-point",createTooltipFunc:point,createTooltipArgs:{label:"Înapoi la "+scenes[i-1].name}});
 if(i<scenes.length-1) cfg.scenes[s.id].hotSpots.push({pitch:-24,yaw:0,type:"scene",sceneId:scenes[i+1].id,cssClass:"floor-point",createTooltipFunc:point,createTooltipArgs:{label:"Mergi la "+scenes[i+1].name}});
});
const viewer=pannellum.viewer("pano",cfg), rail=document.getElementById("rail"), title=document.getElementById("title");
scenes.forEach(s=>{const b=document.createElement("button");b.className="card";b.dataset.id=s.id;b.innerHTML='<img loading="lazy" src="'+s.img+'"><b>'+s.name+'</b>';b.onclick=()=>viewer.loadScene(s.id);rail.appendChild(b)});
function sync(){const id=viewer.getScene(),s=scenes.find(x=>x.id===id);title.textContent=s?s.name:"TUR 360°";rail.querySelectorAll('.card').forEach(b=>b.classList.toggle('active',b.dataset.id===id))}
viewer.on("scenechange",sync);sync();
const zoom=d=>viewer.setHfov(Math.max(58,Math.min(120,viewer.getHfov()+d)));zin.onclick=()=>zoom(-7);zout.onclick=()=>zoom(7);full.onclick=()=>document.documentElement.requestFullscreen?.();
let motionOn=false,lastAlpha=null,baseAlpha=0,baseYaw=0;
function angleDiff(a,b){let d=a-b;while(d>180)d-=360;while(d<-180)d+=360;return d}
function handleOrientation(e){
 if(!motionOn||e.alpha==null)return;
 if(lastAlpha===null){lastAlpha=e.alpha;baseAlpha=e.alpha;baseYaw=viewer.getYaw();return;}
 const d=angleDiff(e.alpha,baseAlpha);viewer.setYaw(baseYaw-d);
 const p=90-(e.beta??90);viewer.setPitch(Math.max(-75,Math.min(75,p)));
}
async function enableMotion(){
 try{
   if(typeof DeviceOrientationEvent!=="undefined" && typeof DeviceOrientationEvent.requestPermission==="function"){
     const p=await DeviceOrientationEvent.requestPermission(); if(p!=="granted")throw new Error("permission");
   }
   motionOn=true;lastAlpha=null;window.addEventListener("deviceorientation",handleOrientation,true);document.getElementById("motion").style.outline="2px solid #fff";
 }catch(e){alert("Browserul nu permite giroscopul. Poți explora turul prin glisare cu degetul.");}
}
motion.onclick=()=>{if(!motionOn)enableMotion()};
go.onclick=async()=>{document.getElementById("start").style.display="none";await enableMotion();document.getElementById("hint").classList.add("show");setTimeout(()=>document.getElementById("hint").classList.remove("show"),6500)};
</script>
</body>
</html>
