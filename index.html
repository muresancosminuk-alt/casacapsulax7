<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Casa Capsula X7 — Tur 360°</title>
<style>
html,body,#viewer{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}
#viewer{position:relative}
#pano{width:100%;height:100%}
#top{position:absolute;top:16px;left:16px;right:16px;z-index:5;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.brand{background:rgba(0,0,0,.58);color:#fff;padding:11px 15px;border-radius:12px;font-weight:700;backdrop-filter:blur(8px)}
#offer{pointer-events:auto;background:#fff;color:#111;text-decoration:none;padding:11px 16px;border-radius:12px;font-weight:700;box-shadow:0 4px 18px #0005}
#rooms{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:8px;max-width:95%;overflow:auto;padding:4px}
.room{border:0;background:rgba(0,0,0,.62);color:#fff;padding:10px 13px;border-radius:10px;white-space:nowrap;font-weight:600}
.room.active{background:#fff;color:#111}
.pnlm-hotspot.floor-point{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid #fff;box-shadow:0 4px 18px rgba(0,0,0,.45);backdrop-filter:blur(4px);transition:.18s;display:flex;align-items:center;justify-content:center}
.pnlm-hotspot.floor-point:hover{transform:scale(1.15);background:rgba(255,255,255,.35)}
.floor-point .dot{width:12px;height:12px;border-radius:50%;background:#fff;display:block}
#hint{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);z-index:4;background:#0009;color:#fff;padding:8px 12px;border-radius:9px;font-size:13px}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
</head>
<body>
<div id="viewer">
 <div id="pano"></div>
 <div id="top"><div class="brand">CASA CAPSULA X7 · TUR 360°</div><a id="offer" href="https://wa.me/?text=Salut!%20Vreau%20o%20oferta%20pentru%20Casa%20Capsula%20X7." target="_blank" rel="noopener">SOLICITĂ OFERTĂ</a></div>
 <div id="hint">Trage cu degetul / mouse-ul pentru a privi în jur • scroll pentru zoom</div>
 <div id="rooms"></div>
</div>
<script>
const scenes=[
 {id:"p2",name:"LIVING",img:"IMG_20261005_154900_00_182.jpg"},
 {id:"p3",name:"BUCĂTĂRIE",img:"IMG_20261005_155133_00_183.jpg"},
 {id:"p4",name:"LIVING · 2",img:"IMG_20261005_155143_00_184.jpg"},
 {id:"p5",name:"HOL",img:"IMG_20261005_155246_00_185.jpg"},
 {id:"p6",name:"LIVING · PANORAMĂ",img:"IMG_20261005_155322_00_186.jpg"},
 {id:"p7",name:"INTRARE · UȘĂ",img:"IMG_20261005_155406_00_187.jpg"},
 {id:"p8",name:"HOL · LIVING",img:"IMG_20261005_155514_00_188.jpg"},
 {id:"p9",name:"HOL · BAIE",img:"IMG_20261005_155554_00_189.jpg"},
 {id:"p10",name:"HOL · 2",img:"IMG_20261005_155646_00_190.jpg"}
];
const cfg={default:{firstScene:"p1",sceneFadeDuration:700,autoLoad:true,showControls:true},scenes:{}};
scenes.forEach((s,i)=>{
 cfg.scenes[s.id]={title:s.name,type:"equirectangular",panorama:s.img,hfov:100,hotSpots:[]};
 if(i>0) cfg.scenes[s.id].hotSpots.push({
   pitch:-20,yaw:180,type:"scene",sceneId:scenes[i-1].id,
   cssClass:"floor-point",createTooltipFunc:floorPoint,createTooltipArgs:{label:"Înapoi la "+scenes[i-1].name}
 });
 if(i<scenes.length-1) cfg.scenes[s.id].hotSpots.push({
   pitch:-20,yaw:0,type:"scene",sceneId:scenes[i+1].id,
   cssClass:"floor-point",createTooltipFunc:floorPoint,createTooltipArgs:{label:"Mergi la "+scenes[i+1].name}
 });
});
function floorPoint(hotSpotDiv,args){
 hotSpotDiv.innerHTML='<span class="dot"></span>';
 hotSpotDiv.title=args.label;
 hotSpotDiv.setAttribute("aria-label",args.label);
}
const viewer=pannellum.viewer("pano",cfg);
const rooms=document.getElementById("rooms");
scenes.forEach(s=>{
 const b=document.createElement("button"); b.className="room"; b.textContent=s.name;
 b.onclick=()=>viewer.loadScene(s.id);
 b.dataset.id=s.id; rooms.appendChild(b);
});
function active(){rooms.querySelectorAll(".room").forEach(b=>b.classList.toggle("active",b.dataset.id===viewer.getScene()));}
viewer.on("scenechange",active); active();
setTimeout(()=>document.getElementById("hint").style.display="none",6000);
</script>
</body>
</html>
